# Production static server.
#
# No API proxying here. The client resolves the gateway from
# window.location.hostname at page load, so nginx only needs to serve files.
# Proxying would bake this container's view of the network into the path the
# browser takes, which is the thing this project deliberately avoids.

server {
  # 4091 inside the container as well as outside, so the port is the same
  # number everywhere and there is nothing to translate when reading a log.
  listen 4091;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed asset filenames, so they can cache indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Never cache. This is the file that can be edited to point the client at a
  # different gateway without rebuilding the bundle.
  location = /runtime-config.js {
    add_header Cache-Control "no-store";
  }

  # Never cache the entry point either, otherwise a deploy leaves browsers
  # holding an index that references assets which no longer exist.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
